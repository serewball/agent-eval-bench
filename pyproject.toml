[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-bench"
version = "0.3.0"
description = "轻量级 Agent 评测台：Pass@k / Pass^k / 过程指标 / 失败归因"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-eval-bench contributors" }]
keywords = ["agent", "evaluation", "llm", "pass@k", "reliability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
evalbench = "evalbench.cli:main"

[tool.setuptools.packages.find]
include = ["evalbench*"]
